[package]
name = "rust-faces"
version = "2.0.0"
edition = "2024"
authors = ["Rusty Builder <usty_builder@mail2world.com>"]
description = "A Rust library for face detection"
license = "MIT"
repository = "https://github.com/rustybuilder/rust-faces"
readme = "README.md"

[dependencies]
image = "0.25.10"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "cuda", "coreml", "vitis"] }
nshare = { version = "0.10.0", features = ["ndarray"] }
imageproc = { version = "0.27.0", optional = true }
reqwest = { version = "0.13.4", features = ["blocking"] }
thiserror = "2.0.20"
itertools = "0.15.0"
indicatif = "0.18.6"
directories = "6.0.0"

[features]
default = []
viz = ["dep:imageproc"]

[dev-dependencies]
rstest = "0.26.1"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[test]]
name = "test_code_design"
path = "tests/test_code_design.rs"

[[bench]]
name = "detectors"
harness = false
